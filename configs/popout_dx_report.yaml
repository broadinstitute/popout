# popout DX report — experimental diagnostic on popout vs other tools.
#
# Faithful rendering: chart compute() reads the bundle as-is, no
# in-report transformations (no MID fold, no canonicalisation). Any
# data cleanup belongs in the collector.

title: popout DX report

style:
  pdf_engine: xelatex
  margin: 0.75in
  fontsize: 10pt
  mainfont: Helvetica
  monofont: Menlo
  highlight_style: tango

defaults:
  target_space: SP6
  mid_rule: null

sections:
  - id: cover
    template: popout_dx/cover.j2

  - id: label_space_conventions
    template: _components/label_space_conventions.j2

  - id: reading_guide
    template: popout_dx/reading_guide.j2

  - id: traffic_light_grid
    template: popout_dx/traffic_light.j2
    chart: traffic_light_grid
    pair: [popout]

  - id: per_tool_concordance
    template: popout_dx/per_tool_concordance.j2
    chart: per_label_ccc
    pair: [popout]

  - id: per_sample_mae
    template: popout_dx/per_sample_mae.j2
    chart: per_sample_mae_violin
    pair: [popout]

  - id: confusion
    template: popout_dx/confusion.j2
    chart: dx_confusion_heatmap
    pair: [popout]

  - id: per_cluster_grid
    template: popout_dx/per_cluster_grid.j2
    data: per_cluster_grid
    pair: [popout]

  - id: local_summary
    template: popout_dx/local_summary.j2
    data: local_summary
    pair: [popout]
    when: bundle.get("mode") == "global_local"

  - id: bp_confusion
    template: popout_dx/bp_confusion.j2
    chart: bp_confusion
    pair: [popout, flare]
    when: bundle.get("mode") == "global_local"

  - id: boundary_localization
    template: popout_dx/boundary_localization.j2
    chart: boundary_localization
    pair: [popout, flare]
    when: bundle.get("mode") == "global_local"

  - id: coarse_grid
    template: popout_dx/coarse_grid.j2
    chart: coarse_grid
    pair: [popout, flare]
    when: bundle.get("mode") == "global_local"

  - id: provenance
    template: _components/provenance_appendix.j2
