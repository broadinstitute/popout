# popout DX report — experimental diagnostic on popout vs other tools.

title: popout DX report

style:
  pdf_engine: xelatex
  margin: 0.75in
  fontsize: 10pt
  mainfont: Helvetica
  monofont: Menlo
  highlight_style: tango

defaults:
  target_space: SP5
  mid_rule: drop

sections:
  - id: cover
    template: popout_dx/cover.j2

  - id: label_space_conventions
    template: _components/label_space_conventions.j2

  - id: reading_guide
    template: _components/reading_guide_metrics.j2

