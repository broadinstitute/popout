# FLARE validation report — NIH deliverable.
#
# Sections list runs in order. Each section names its template and (when
# the section compares two tools) its pair + mid_rule. The `defaults:`
# block applies when a section omits the relevant key.
#
# Phase 2 skeleton: only the four spine sections (cover, reading guide,
# label-space conventions, provenance). Phase 3 adds the rest.

title: FLARE validation report

style:
  pdf_engine: xelatex
  margin: 0.75in
  fontsize: 10pt
  mainfont: Helvetica
  monofont: Menlo
  highlight_style: tango

defaults:
  target_space: SP5
  mid_rule: drop

sections:
  - id: cover
    template: flare_validation/cover.j2

  - id: label_space_conventions
    template: _components/label_space_conventions.j2

  - id: reading_guide
    template: _components/reading_guide_metrics.j2

  - id: cohort_composition
    template: flare_validation/cohort_composition.j2
    chart: cohort_composition
    pair: [flare]

  - id: cohort_structure_pair_census
    template: flare_validation/cohort_structure_pair_census.j2
    chart: cohort_structure_pair_census
    pair: [flare]

  - id: cohort_structure_top1_top2
    template: flare_validation/cohort_structure_top1_top2.j2
    chart: cohort_structure_top1_top2
    pair: [flare]

  - id: cohort_structure_3way_face
    template: flare_validation/cohort_structure_3way_face.j2
    chart: cohort_structure_3way_face
    pair: [flare]

  - id: ccc_chrom_drift
    template: flare_validation/ccc_chrom_drift.j2
    chart: ccc_chrom_drift
    pair: [flare]

  - id: ccc_chrom_stdev
    template: flare_validation/ccc_chrom_stdev.j2
    chart: ccc_chrom_stdev
    pair: [flare]

  - id: ccc_pair_mad
    template: flare_validation/ccc_pair_mad.j2
    chart: ccc_pair_mad
    pair: [flare]

  - id: ccc_dose_response
    template: flare_validation/ccc_dose_response.j2
    chart: ccc_dose_response
    pair: [flare]

  - id: admixture
    template: flare_validation/admixture.j2
    chart: admixture_bar
    pair: [flare]

  - id: ternary
    template: flare_validation/ternary.j2
    chart: ternary
    pair: [flare]

  - id: flare_vs_rye_concordance
    template: flare_validation/concordance.j2
    chart: concordance_strip
    pair: [flare, rye]
    mid_rule: drop

  - id: flare_vs_rf_calibration
    template: flare_validation/calibration.j2
    chart: calibration_heatmap
    pair: [flare, rf]
    target_space: SP6

  - id: flare_vs_rf_confusion
    template: flare_validation/confusion.j2
    chart: confusion_heatmap
    pair: [flare, rf]
    target_space: SP6
    # No mid_rule — the report renders confusion_rf.tsv faithfully,
    # whatever space the bundle delivers it in. Folding MID into EUR
    # is the stats collector's job; tracked in COLLECTOR_FIXES.md.

  - id: tract_length
    template: flare_validation/tract_length.j2
    chart: tract_length
    pair: [flare]

  - id: switch_rate
    template: flare_validation/switch_rate.j2
    chart: switch_rate
    pair: [flare]

  - id: hap_disagreement
    template: flare_validation/hap_disagreement.j2
    chart: hap_disagreement
    pair: [flare, rf]
    target_space: SP6

  - id: regional
    template: flare_validation/regional.j2
    chart: regional_manhattan
    pair: [flare]

  - id: label_correlation
    template: flare_validation/label_correlation.j2
    chart: label_correlation
    pair: [flare, rf]
    target_space: SP6

  - id: provenance
    template: _components/provenance_appendix.j2
