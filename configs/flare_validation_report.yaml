# FLARE validation report — NIH deliverable.
#
# Sections list runs in order. Each section names its template and (when
# the section compares two tools) its pair + mid_rule. The `defaults:`
# block applies when a section omits the relevant key.
#
# Phase 2 skeleton: only the four spine sections (cover, reading guide,
# label-space conventions, provenance). Phase 3 adds the rest.

title: FLARE validation report

style:
  pdf_engine: xelatex
  margin: 0.75in
  fontsize: 10pt
  mainfont: Helvetica
  monofont: Menlo
  highlight_style: tango

defaults:
  target_space: SP5
  mid_rule: drop
  # Suppress the per-figure label-space tag for sections that use only
  # the report's defaults and only by-name matchers (the common case
  # now that FLARE calls are taken verbatim). Cross-tool or non-name
  # sections still emit a slim tag.
  tag_policy: minimal
  # Stamp a DRAFT footer on every page. Flip to false once the report
  # is finalized.
  draft: true

sections:
  - id: cover
    template: flare_validation/cover.j2

  - id: label_space_conventions
    template: _components/label_space_conventions.j2

  - id: reading_guide
    template: _components/reading_guide_metrics.j2

  - id: cohort_composition
    template: flare_validation/cohort_composition.j2
    chart: cohort_composition
    pair: [flare]

  - id: cluster_composition
    template: flare_validation/cluster_composition.j2
    chart: cluster_composition
    pair: [flare]

  - id: cohort_structure_pair_census
    template: flare_validation/cohort_structure_pair_census.j2
    chart: cohort_structure_pair_census
    pair: [flare]

  - id: cohort_structure_top1_top2
    template: flare_validation/cohort_structure_top1_top2.j2
    chart: cohort_structure_top1_top2
    pair: [flare]

  - id: ccc_chrom_drift
    template: flare_validation/ccc_chrom_drift.j2
    chart: ccc_chrom_drift
    pair: [flare]

  - id: panel_coverage_attribution
    template: flare_validation/panel_coverage_attribution.j2
    chart: panel_coverage_attribution
    pair: [flare, rye]
    # Reads cohort/cohort_global.tsv directly (v6 named columns) plus
    # an external Rye Q TSV passed to build_flare_validation_report.py
    # via --rye-q. The section's prose stands on its own when --rye-q
    # is omitted; the figure is then skipped with a note.

  - id: admixture
    template: flare_validation/admixture.j2
    chart: admixture_bar
    pair: [flare]

  - id: flare_vs_rye_concordance
    template: flare_validation/concordance.j2
    chart: concordance_strip
    source: rye
    pair: [flare, rye]
    mid_rule: drop

  - id: flare_vs_rf_concordance
    template: flare_validation/concordance.j2
    chart: concordance_strip
    source: rf
    pair: [flare, rf]
    target_space: SP6
    # Same raincloud + sina layout as the Rye concordance section.
    # Reads cohort/concordance_metrics_rf.tsv (per-ancestry r + CCC on
    # the SP5 intersection; MID is RF-only and lives in the confusion
    # section below).

  - id: flare_vs_rf_calibration
    template: flare_validation/calibration.j2
    chart: calibration_heatmap
    pair: [flare, rf]
    target_space: SP6

  - id: flare_vs_rf_confusion
    template: flare_validation/confusion.j2
    chart: confusion_heatmap
    source: rf
    pair: [flare, rf]
    target_space: SP6
    # No mid_rule — the report renders confusion_rf.tsv faithfully,
    # whatever space the bundle delivers it in. Folding MID into EUR
    # is the stats collector's job; tracked in COLLECTOR_FIXES.md.

  - id: flare_vs_rye_confusion
    template: flare_validation/confusion.j2
    chart: confusion_heatmap
    source: rye
    pair: [flare, rye]
    # Symmetric hard-call confusion FLARE rows x Rye cols.
    # Reads cohort/confusion_rye.tsv. Rye has no MID column so the
    # matrix is square on the 5 SP5 labels.

  - id: tract_length
    template: flare_validation/tract_length.j2
    chart: tract_length
    pair: [flare]

  - id: switch_rate
    template: flare_validation/switch_rate.j2
    chart: switch_rate
    pair: [flare]

  - id: hap_disagreement
    template: flare_validation/hap_disagreement.j2
    chart: hap_disagreement
    pair: [flare]

  - id: regional
    template: flare_validation/regional.j2
    chart: regional_manhattan
    pair: [flare]

  - id: provenance
    template: _components/provenance_appendix.j2
