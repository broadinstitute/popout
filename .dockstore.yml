version: 1.2

workflows:
  - name: vcf-to-pgen
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/vcf_to_pgen.wdl
    topic: Convert phased VCF files to PGEN format
  - name: filter-pgen
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/filter_pgen.wdl
    topic: Filter PGEN files with configurable plink2 QC profiles
  - name: pgen-to-vcf
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/pgen_to_vcf.wdl
    topic: Export PGEN files to VCF with optional sample subsetting
  - name: bcftools-split
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_split.wdl
    topic: Split a biobank-scale VCF into per-sample-group sub-VCFs in one bcftools +split pass
  - name: bcftools-concat
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_concat.wdl
    topic: Concatenate per-chromosome VCFs into a whole-genome VCF (bcftools concat --naive option)
  - name: bcftools-view
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_view.wdl
    topic: General-purpose bcftools view wrapper for region/sample/filter subsetting (scatter for per-chrom chunking)
  - name: bcftools-reheader
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_reheader.wdl
    topic: Inject ##KEY header lines lifted verbatim from a source VCF into a target VCF (fixes merge-time header drops like ##ANCESTRY)
  - name: bcftools-bcf-to-vcf
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_bcf_to_vcf.wdl
    topic: Convert a phased BCF to bgzipped VCF (+ tabix), sized for input + output on local disk
  - name: flare
    subclass: WDL
    primaryDescriptorPath: /workflows/flare/wdl/flare.wdl
    topic: FLARE local-ancestry inference on a phased VCF chunk against a reference panel
  - name: flare-pipeline
    subclass: WDL
    primaryDescriptorPath: /workflows/flare/wdl/flare_pipeline.wdl
    topic: End-to-end FLARE LAI orchestration over biobank-scale chromosome shards and sample clusters
  - name: flare-validate
    subclass: WDL
    primaryDescriptorPath: /workflows/flare/wdl/flare_validate.wdl
    topic: Per-cluster FLARE validation (scatter diagnostics + cohort collation, versioned artifact bundle)
  - name: flare-cleanup
    subclass: WDL
    primaryDescriptorPath: /workflows/flare/wdl/flare_cleanup.wdl
    topic: Bookkeeping-first sample removal from per-cluster FLARE outputs before the chromosome-level merge
  - name: flare-finalize
    subclass: WDL
    primaryDescriptorPath: /workflows/flare/wdl/flare_finalize.wdl
    topic: Chromosome-level cross-cluster merge of FLARE outputs (anc VCFs + global TSVs)
  - name: gpu-probe
    subclass: WDL
    primaryDescriptorPath: /workflows/gpu_probe/wdl/gpu_probe.wdl
    topic: Validate GPU machine types on Terra
  - name: throughput-probe
    subclass: WDL
    primaryDescriptorPath: /workflows/lai-tools/wdl/throughput_probe.wdl
    topic: Layered throughput diagnostic for gs:// VCF streaming (curl/gcloud/htslib/bcftools, streaming vs local)
  - name: sha256-manifest
    subclass: WDL
    primaryDescriptorPath: /workflows/lai-tools/wdl/sha256_manifest.wdl
    topic: SHA-256 of a single file; Terra-scatter one workflow per data-table row to populate a hash column
  - name: popout
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout.wdl
    topic: Run popout on one chromosome in seed/train/infer mode (parametrized task)
  - name: popout-pipeline
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_pipeline.wdl
    topic: End-to-end popout LAI — train on one chrom, scatter inference over the rest
  - name: popout-label
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_label.wdl
    topic: Label popout ancestries against a pre-built population panel
  - name: popout-build-panel
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_build_panel.wdl
    topic: Build per-population allele-frequency panel TSV from 1KG or gnomAD VCFs
  - name: popout-dx
    subclass: WDL
    primaryDescriptorPath: /workflows/popout_dx/wdl/popout_dx.wdl
    topic: popout diagnostics — per-cluster comparison of popout against any subset of {flare, rye, rf}
