version: 1.2

workflows:
  - name: vcf-to-pgen
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/vcf_to_pgen.wdl
    topic: Convert phased VCF files to PGEN format
  - name: filter-pgen
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/filter_pgen.wdl
    topic: Filter PGEN files with configurable plink2 QC profiles
  - name: pgen-to-vcf
    subclass: WDL
    primaryDescriptorPath: /workflows/plink2/wdl/pgen_to_vcf.wdl
    topic: Export PGEN files to VCF with optional sample subsetting
  - name: bcftools-split
    subclass: WDL
    primaryDescriptorPath: /workflows/bcftools/wdl/bcftools_split.wdl
    topic: Split a biobank-scale VCF into per-sample-group sub-VCFs in one bcftools +split pass
  - name: gpu-probe
    subclass: WDL
    primaryDescriptorPath: /workflows/gpu_probe/wdl/gpu_probe.wdl
    topic: Validate GPU machine types on Terra
  - name: popout
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout.wdl
    topic: GPU-accelerated local ancestry inference at biobank scale
  - name: popout-report
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_report.wdl
    topic: Generate visualization report from popout LAI results
  - name: popout-label
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_label.wdl
    topic: Label popout ancestries against a pre-built population panel
  - name: popout-build-panel
    subclass: WDL
    primaryDescriptorPath: /workflows/popout/wdl/popout_build_panel.wdl
    topic: Build per-population allele-frequency panel TSV from 1KG or gnomAD VCFs
